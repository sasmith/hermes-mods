name: open-asks
version: 0.1.0
description: >
  Every question a chat reply leaves for the user becomes a blocked Kanban card linked to the chat, so the
  session shows as waiting on them instead of the ask living only in chat text. Skips a turn that already
  filed/blocked a card or points at an already-blocked card; reminds the next turn to archive the card once
  answered.
author: daveey
# Superseded by user-steps (model-based ask extraction, Desktop 'For you' strip, one rolling card per chat).
retired: user-steps
provides_hooks:
  - pre_llm_call
  - transform_tool_result
  - transform_llm_output
